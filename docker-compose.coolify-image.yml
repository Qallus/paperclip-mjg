# Paperclip on Coolify using the prebuilt image — no Git repo required.
#
# Paste this whole file into Coolify:
#   New Resource > Docker Compose (Empty)  ->  paste  ->  set domain  ->  Deploy
#
# Nothing is built on your VPS, so a small server is fine. The trade-off is
# that you run upstream Paperclip as published; you cannot deploy your own
# changes this way. For that, use docker-compose.coolify.yml instead, which
# builds from a Git repo.
#
# Required environment variables (set in Coolify > Environment Variables):
#   POSTGRES_PASSWORD                     generate: openssl rand -hex 24
#   BETTER_AUTH_SECRET                    generate: openssl rand -hex 32
#   PAPERCLIP_TOOL_ACTION_SIGNING_SECRET  generate: openssl rand -hex 32
#
# Optional:
#   ANTHROPIC_API_KEY / OPENAI_API_KEY    at least one is needed for agents to run
#   PAPERCLIP_AUTH_DISABLE_SIGN_UP=true   set AFTER you create the first account

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_DB: paperclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 5s
      timeout: 5s
      retries: 30

  paperclip:
    # Multi-arch (amd64 + arm64), public, no registry login needed.
    # `:latest` moves on every stable release. To stay put, pin the digest:
    #   ghcr.io/paperclipai/paperclip@sha256:a02ac35ac41df911af477422ea0e781cf41d2b2c600c66f0a5ac9d8c63f52c2c
    image: ghcr.io/paperclipai/paperclip:latest
    restart: unless-stopped
    # The image makes tini PID 1, so orphaned agent descendants get reaped.
    # This is the backstop if something leaks anyway: the container hits its
    # own ceiling and dies visibly rather than starving the host of pids.
    pids_limit: 2048
    expose:
      - "3100"
    environment:
      # Coolify replaces this with the domain configured for this service and
      # generates the matching proxy labels. Do not set it by hand.
      - SERVICE_FQDN_PAPERCLIP_3100

      - PORT=3100
      - HOST=0.0.0.0
      - SERVE_UI=true
      - PAPERCLIP_HOME=/paperclip
      - DATABASE_URL=postgres://paperclip:${POSTGRES_PASSWORD}@db:5432/paperclip

      # Internet-facing: login required, explicit public URL, strict checks.
      - PAPERCLIP_DEPLOYMENT_MODE=authenticated
      - PAPERCLIP_DEPLOYMENT_EXPOSURE=public
      - PAPERCLIP_PUBLIC_URL=${SERVICE_FQDN_PAPERCLIP_3100}

      # Coolify's proxy reaches this container over the private Docker
      # network, so X-Forwarded-* is trusted only from private ranges.
      # Without this Express trusts nothing and auth rate limiting (on by
      # default in public mode) buckets every request under the proxy's IP.
      - TRUST_PROXY=${TRUST_PROXY:-uniquelocal}

      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      - PAPERCLIP_TOOL_ACTION_SIGNING_SECRET=${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?PAPERCLIP_TOOL_ACTION_SIGNING_SECRET must be set}

      # Close public sign-up once the first account exists (it becomes admin).
      - PAPERCLIP_AUTH_DISABLE_SIGN_UP=${PAPERCLIP_AUTH_DISABLE_SIGN_UP:-false}

      # At least one provider key is needed before agents can do work.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Embedded state that is NOT in Postgres: uploads, agent workspaces,
      # and the local secrets master key. Losing this volume loses the key
      # that decrypts stored secrets.
      - paperclip-data:/paperclip
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  paperclip-data:
